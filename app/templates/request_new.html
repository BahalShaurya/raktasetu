{% extends "base.html" %}{% block body %}<div class="card" style="max-width:640px;margin:auto"><h1>Raise an emergency request</h1><form method="post" class="f">
<label>Hospital</label><select name="hospital">{% for h in hospitals %}<option value="{{ h.hospital_id }}">{{ h.hospital_name }}, {{ h.city }}</option>{% endfor %}</select>
<label>Patient name</label><input name="patient" required><div class="grid g3"><div><label>Blood group</label><select name="bg">{% for g in groups %}<option value="{{ g.bg_id }}">{{ g.group_name }}</option>{% endfor %}</select></div><div><label>Units</label><input type="number" name="units" min="1" value="1" required></div><div><label>Needed by</label><input type="date" name="required_by" value="{{ today }}" required></div></div>
<label>Urgency</label><select name="urgency"><option>NORMAL</option><option>URGENT</option><option>CRITICAL</option></select><label>Contact phone</label><input name="contact"><label>Note</label><input name="note"><p><button>Raise request</button></p></form></div>{% endblock %}
